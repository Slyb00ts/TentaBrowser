[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
exclude = ["tests/linktest", "crates/tenta-net/fuzz", "crates/tenta-html/fuzz"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/Slyb00ts/TentaBrowser"

[workspace.dependencies]
# Internal crates (dependency direction: docs/spec/02-architecture.md §2, enforced by `cargo xtask lint-deps`).
tenta-core = { path = "crates/tenta-core" }
# Vendored fork of `h2` with the fingerprint patch (docs/spec/03-network.md §1).
tenta-h2 = { path = "crates/tenta-h2" }
tenta-net = { path = "crates/tenta-net" }
tenta-html = { path = "crates/tenta-html" }
tenta-dom = { path = "crates/tenta-dom" }
tenta-css = { path = "crates/tenta-css" }
tenta-idl = { path = "crates/tenta-idl" }
tenta-js = { path = "crates/tenta-js" }
tenta-js-v8 = { path = "crates/tenta-js-v8" }
tenta-js-qjs = { path = "crates/tenta-js-qjs" }
tenta-layout = { path = "crates/tenta-layout" }
tenta-paint = { path = "crates/tenta-paint" }
tenta-render = { path = "crates/tenta-render" }
tenta-media = { path = "crates/tenta-media" }
tenta-webrtc = { path = "crates/tenta-webrtc" }
tenta-page = { path = "crates/tenta-page" }
tenta-browser = { path = "crates/tenta-browser" }
tenta-search = { path = "crates/tenta-search" }
tenta-cdp = { path = "crates/tenta-cdp" }
tenta-mcp = { path = "crates/tenta-mcp" }
tenta-ffi = { path = "crates/tenta-ffi" }
tentabrowser = { path = "crates/tentabrowser" }
tenta-testutil = { path = "crates/tenta-testutil" }

# Shared third-party dependencies. Versions are pinned here once and only here.
anyhow = "1"
bytes = "1"
hashbrown = "0.16"
libc = "0.2"
winapi-util = "=0.1.11"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = { version = "1", features = ["union", "const_generics"] }
thiserror = "2"
# Async runtime. `tenta-net` owns the io threads; the page threads run a
# current-thread runtime each (docs/spec/02-architecture.md §3).
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
toml = "0.9"
tracing = "0.1"
url = "2"
http = "1"
memchr = "2"
getrandom = "=0.4.3"
encoding_rs = "0.8"
selectors = "0.40"
cssparser = "0.37"
style = { package = "stylo", version = "=0.21.0" }
style_traits = { package = "stylo_traits", version = "=0.21.0" }
servo_arc = "0.4.3"
stylo_static_prefs = "=0.21.0"
# Stylo's own geometry and element-state crates, named by the cascade adapter.
stylo_dom = "=0.21.0"
euclid = "0.22"
# V8 (rusty_v8), pinned to the release the snapshot and ICU data pack target
# (docs/spec/05-javascript.md §1). Requires its matched, reviewed native artifact.
v8 = { package = "tenta-v8", path = "crates/tenta-v8", version = "=152.2.0" }
# QuickJS-ng, pinned to the native binding ABI used by the generated glue.
rquickjs = { package = "tenta-quickjs-core", path = "crates/tenta-quickjs-core", version = "=0.12.2" }
precomputed-hash = "0.1"
unicode-normalization = "0.1"
# Render stack (docs/dev/p3-plan.md §2). The Linebender text set and skrifa are
# version-locked: parley 0.11 uses skrifa 0.44, so skrifa stays at 0.44.
parley = { version = "0.11", default-features = false, features = ["libm"] }
skrifa = "=0.44.0"
taffy = { version = "0.14", default-features = false, features = ["std", "flexbox", "grid", "calc", "content_size"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
png = "0.18"
zune-jpeg = "=0.5.15"
jpeg-encoder = "0.7"
gif = "0.14"
image-webp = "0.2"
resvg = { version = "0.48", default-features = false, features = ["text", "raster-images"] }
usvg = { version = "0.48", default-features = false, features = ["text"] }
fontdb = { version = "0.24", default-features = false, features = ["std"] }
bytemuck = "1"
bitflags = "2"
atomic_refcell = "0.1"

[profile.release]
# Native boundaries are wrapped in catch_unwind (docs/spec/02-architecture.md §8); unwinding must stay on.
panic = "unwind"
opt-level = 3
lto = "thin"
codegen-units = 16
debug = "line-tables-only"
strip = "none"

[profile.release-dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.bench]
inherits = "release"
