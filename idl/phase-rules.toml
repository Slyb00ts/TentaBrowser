# Hand-maintained rules mapping web-platform interface names (as seen in the
# golden-site inventories, golden/inventory/*.json) to the phase that ships
# them, the owning crate, the WebIDL source spec (idl/<spec>/<Interface>.webidl)
# and the WPT directory used by the WPT runner.
#
# Sources: docs/spec/05-javascript.md Appendix A (surface by phase),
# docs/spec/16-roadmap.md (what each phase ships), docs/spec/02-architecture.md
# section 2 (crate map), docs/spec/07-media.md, docs/spec/20-platform-behaviour.md.
#
# `idl/gen_manifest.py` tries `[[rule]]` entries in order; the first whose
# `match` (an anchored regular expression) matches the interface name wins.
# `phase = "unscheduled"` marks a known family that no roadmap phase ships;
# such interfaces land in the `[[unassigned]]` section of the manifest with
# the family named, so a human can schedule or reject them. Interfaces that
# match no rule land there too.
#
# `kind = "ecmascript"` marks ECMAScript intrinsics (no WebIDL file; the
# engines provide them, QuickJS with `tenta-js-qjs` glue).
#
# `[[member_rule]]` entries name members whose implementation lives in a
# later phase or another crate than their interface (layout geometry on
# Element, canvas on HTMLCanvasElement, ...). They are reported per interface
# as `deferred_members` so that P2 ships the interface with stubs for them.

version = 1

[phases]
P1 = "Network, DOM, Search"
P2 = "JavaScript: engines, event loop, DOM/HTML/CSSOM bindings, fetch, storage, workers"
P3a = "Render: Stylo, block/inline layout, geometry APIs"
P3b = "Render: flex/grid/table/positioned, scrolling, form controls"
P3c = "Render: paint, images, canvas 2D, screenshots, PDF"
P4 = "Hosts and platform completeness: CDP, MCP, FFI, Shared/Service Workers, IndexedDB, editing"
P5 = "Audio: Web Audio, worklets, media element audio, capture"
P6a = "Video and MSE"
P7 = "WebRTC"
P8 = "Mobile, hardening, WebGL shape-only, OffscreenCanvas, 1.0"

# ---------------------------------------------------------------------------
# ECMAScript (no WebIDL)
# ---------------------------------------------------------------------------

[[rule]]
match = "Intl|Intl\\..*"
kind = "ecmascript"
phase = "P2"
crate = "tenta-js-qjs"
wpt = ""
note = "V8 native; QuickJS subset via icu4x (16-roadmap P2 (b)); the inventory lists the locale-sensitive Date/Number/String methods under Intl"

[[rule]]
match = "SharedArrayBuffer|Atomics"
kind = "ecmascript"
phase = "P2"
crate = "tenta-js-qjs"
wpt = ""
note = "V8 native; QuickJS shared-array-buffer hooks and the futex table for wait/notify/waitAsync (05 section 7)"

# ---------------------------------------------------------------------------
# WebAssembly JS API (WebIDL, engine-independent layer over wasmi)
# ---------------------------------------------------------------------------

[[rule]]
match = "WebAssembly|WebAssembly\\..*"
spec = "wasm-js-api"
phase = "P2"
crate = "tenta-js"
wpt = "wasm/jsapi/"

# ---------------------------------------------------------------------------
# WebRTC (P7, tenta-webrtc)
# ---------------------------------------------------------------------------

