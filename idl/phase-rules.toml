wpt = "webrtc-encoded-transform/"
note = "insertable streams; P7 stretch (07 section 3.1)"

[[rule]]
match = "RTC.*"
spec = "webrtc"
phase = "P7"
crate = "tenta-webrtc"
wpt = "webrtc/"

