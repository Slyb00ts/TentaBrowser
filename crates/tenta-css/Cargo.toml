[package]
name = "tenta-css"
description = "CSS parsing, CSSOM objects and Stylo integration glue."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[example]]
name = "cssom_flat"
required-features = ["stylo"]

[[example]]
name = "cssom_detached"
required-features = ["stylo"]

[features]
default = []
stylo = ["dep:cssparser", "dep:selectors", "dep:servo_arc", "dep:style_traits", "dep:style", "dep:stylo_static_prefs", "dep:url"]

[dependencies]
tenta-core = { workspace = true }
tenta-dom = { workspace = true }
cssparser = { workspace = true, optional = true }
selectors = { workspace = true, optional = true }
servo_arc = { workspace = true, optional = true }
style_traits = { workspace = true, optional = true }
style = { workspace = true, optional = true }
stylo_static_prefs = { workspace = true, optional = true }
url = { workspace = true, optional = true }
