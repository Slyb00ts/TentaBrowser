[package]
name = "tenta-js"
description = "Tier 2: engine trait, InterfaceRegistry, event loop, bindings runtime, timers, fetch/XHR/WebSocket, storage, workers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Enabling `v8` (resp. `quickjs`) pulls the engine crate and compiles the
# generated `*_v8.rs` (resp. `*_qjs.rs`) DOM glue in `src/bindings`. The
# engine-independent bindings compile without either feature.
v8 = ["dep:v8"]
quickjs = []

[dependencies]
tenta-core = { workspace = true }
tenta-net = { workspace = true }
tenta-dom = { workspace = true }
tenta-html = { workspace = true }
tenta-css = { workspace = true }
# The `Headers` host validates a header name with the `http` crate's field-name
# `token` production rather than restating the character table. `tenta-net`
# already depends on it, so this adds no node to the dependency graph.
http = { workspace = true }
# The `URL` and `URLSearchParams` hosts are the WHATWG URL parser and the
# `application/x-www-form-urlencoded` serializer themselves; hand-writing
# either is how the two get out of step with the rest of the browser tier.
url = { workspace = true }
# The `TextDecoder` host is the Encoding Standard's label lookup and its
# decoding algorithms, and the `TextEncoder` host is that standard's UTF-8
# encoder. The algorithms are stateful and incremental — a partial sequence
# has to survive from one `{stream: true}` call to the next — and a second
# implementation is how the two drift apart. `tenta-html` already depends on
# `encoding_rs` for the parser's own decoder, so this adds no node to the
# dependency graph; `cargo xtask lint-deps` only checks internal
# dependencies, the same basis as the `http` and `url` entries above.
encoding_rs = { workspace = true }
v8 = { workspace = true, optional = true }

[build-dependencies]
tenta-idl = { workspace = true }
