[package]
name = "tenta-layout"
description = "Tier 3: box tree, block/inline/flex/grid/table/positioned layout, text and form controls."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["embedded-fonts"]
# Compiles the bundled Liberation and DejaVu fonts into the crate (D-028). Without
# it the crate carries no font data and a caller must supply its own.
embedded-fonts = []
# Lets a FontSystem fall back to the platform font database for scripts the bundled
# fonts lack (CJK, Thai, ...). Opt-in per FontSystem; see D-036.
system-fonts = ["embedded-fonts", "dep:fontique"]

[dependencies]
tenta-core = { workspace = true }
tenta-dom = { workspace = true }
# Layout reads Stylo's ComputedValues directly; the whole render graph is
# already opt-in through the `render` feature above this crate (D-030).
tenta-css = { workspace = true, features = ["stylo"] }
style = { workspace = true }
servo_arc = { workspace = true }
smallvec = { workspace = true }
bitflags = { workspace = true }
parley = { workspace = true }
fontique = { workspace = true, optional = true, features = ["system", "fontconfig-dlopen"] }
skrifa = { workspace = true }
taffy = { workspace = true }

[dev-dependencies]
tenta-html = { workspace = true }
tenta-css = { workspace = true, features = ["test-util"] }
png = { workspace = true }

[[test]]
name = "system_fonts"
required-features = ["system-fonts"]
