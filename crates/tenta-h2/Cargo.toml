[package]
name = "tenta-h2"
description = "Fork of `h2` with TentaBrowser's HTTP/2 client fingerprint patch (docs/spec/03-network.md §1). Upstream: hyperium/h2 v0.4.19, MIT."
version.workspace = true
edition = "2021"
rust-version.workspace = true
license = "MIT"
repository.workspace = true
publish = false
readme = "README.md"
authors = [
    "Carl Lerche <me@carllerche.com>",
    "Sean McArthur <sean@seanmonstar.com>",
]
# The upstream integration tests live under tests/; the HPACK story corpus
# (58 MB of fixtures) is not vendored.
exclude = ["tests/**"]

[features]
# Enables `futures::Stream` implementations for various types.
stream = []
# Enables **unstable** APIs; the fork's own tests need them.
unstable = []

[dependencies]
atomic-waker = "1.0.0"
futures-core = { version = "0.3", default-features = false }
futures-sink = { version = "0.3", default-features = false }
tokio-util = { version = "0.7.1", features = ["codec", "io"] }
tokio = { version = "1", features = ["io-util"] }
bytes = { workspace = true }
http = { workspace = true }
tracing = { workspace = true }
fnv = "1.0.5"
slab = "0.4.2"
indexmap = { version = "2", features = ["std"] }

[dev-dependencies]
h2-support = { path = "tests/h2-support" }
futures = { version = "0.3", default-features = false, features = ["alloc"] }
tokio = { version = "1", features = ["macros", "net", "rt", "io-util", "rt-multi-thread"] }
tracing = { workspace = true }
# HPACK round-trip property test (src/hpack/test/fuzz.rs).
quickcheck = { version = "1.0.3", default-features = false }
rand = "0.8.4"
env_logger = { version = "0.10", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
