[package]
name = "h2-support"
version = "0.1.0"
authors = ["Carl Lerche <me@carllerche.com>"]
publish = false
edition = "2021"
license = "MIT"

# Vendored from hyperium/h2 v0.4.19 (tests/h2-support) so the fork keeps the
# upstream integration tests. `h2` is `tenta-h2` here; the logging setup was
# replaced with `tracing-subscriber`'s fmt layer to drop the `atty` and
# `tracing-tree` dependencies (see ../../TENTA-PATCH.md).

[dependencies]
tenta-h2 = { path = "../..", features = ["stream", "unstable"] }

bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
futures = { version = "0.3", default-features = false, features = ["alloc"] }
http = "1"
tokio = { version = "1", features = ["time"] }
tokio-test = "0.4"
