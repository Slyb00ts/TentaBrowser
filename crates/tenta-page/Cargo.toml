[package]
name = "tenta-page"
description = "Page, Frame, navigation, session history, lifecycle, settle, dialogs, tier control and watchdogs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Screenshots and geometry through tenta-render. Opt-in so the default build keeps
# the Tier 1 graph (D-030).
render = ["dep:tenta-render", "dep:tenta-css"]

[dependencies]
tenta-core = { workspace = true }
tenta-net = { workspace = true }
tenta-html = { workspace = true }
tenta-dom = { workspace = true }
tenta-js = { workspace = true }
tenta-render = { workspace = true, optional = true }
# Stylesheet sources handed to the render session are tenta-css cascade types.
tenta-css = { workspace = true, optional = true, features = ["stylo"] }

bytes = { workspace = true }
hashbrown = { workspace = true }
http = { workspace = true }
parking_lot = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "test-util"] }
