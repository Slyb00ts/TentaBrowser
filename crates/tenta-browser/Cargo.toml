[package]
name = "tenta-browser"
description = "Browser and BrowserContext: cookies, storage, cache and Service Worker isolation, page threads, isolate pool."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Pulls the V8 backend and installs it as the engine factory for JavaScript
# pages. Without it the default build stays free of V8 and `new_page` reports
# JavaScript as unsupported rather than pretending to run it.
v8 = ["dep:tenta-js-v8", "wpt-driver"]
quickjs = ["dep:tenta-js-qjs", "wpt-driver"]
# Shared target gate: Cargo's required-features cannot express V8 OR QuickJS.
wpt-driver = []
# Forwards to tenta-page: screenshots and geometry, opt-in (D-030).
render = ["tenta-page/render"]

[dependencies]
tenta-core = { workspace = true }
tenta-net = { workspace = true }
tenta-js = { workspace = true }
tenta-js-v8 = { workspace = true, optional = true }
tenta-js-qjs = { workspace = true, optional = true }
tenta-page = { workspace = true }

bytes = { workspace = true }
hashbrown = { workspace = true }
http = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# The subscriber `tenta-wpt-driver` installs on stderr; the library only emits
# events. Same crate and feature set the CLI uses (crates/tentabrowser-cli).
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "std"] }
url = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

# The WPT driver (`wpt/run.py --product tentabrowser`). A second binary in this
# package rather than a crate of its own: `xtask/src/deps.rs` grants
# `tenta-js-v8` to `tenta-browser` and `tentabrowser` only, and a `[[bin]]`
# target adds no package for the layering lint to see. It runs JavaScript, so it
# only exists in a build with an engine.
[[bin]]
name = "tenta-wpt-driver"
path = "src/bin/tenta-wpt-driver.rs"
required-features = ["wpt-driver"]

[dev-dependencies]
tenta-dom = { workspace = true }
png = { workspace = true }
zune-jpeg = { workspace = true }
jpeg-encoder = { workspace = true }
image-webp = { workspace = true }
gif = { workspace = true }
tenta-testutil = { workspace = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }

[[test]]
name = "screenshot"
required-features = ["render"]

[[test]]
name = "images"
required-features = ["render"]

[[test]]
name = "image_events"
required-features = ["render", "v8"]

[[example]]
name = "js_xhr"
required-features = ["v8"]

[[example]]
name = "idle_page_rss"
required-features = ["wpt-driver"]
