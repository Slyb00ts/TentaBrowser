[package]
name = "tentabrowser-cli"
description = "The `tentabrowser` binary: fetch, search, test, screenshot, serve, mcp, scrape and daemon."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
# JavaScript is opt-in so the default CLI keeps its Tier 1 dependency graph.
v8 = ["tentabrowser/v8", "tenta-cdp/v8"]
# Screenshots and geometry; opt-in like v8 (D-030).
render = ["tentabrowser/render", "tenta-cdp/render"]
# Release artifacts are built with this set (docs/dev/p3-plan.md DP-7).
full = ["v8", "render"]

[dependencies]
tenta-core = { workspace = true }
tentabrowser = { workspace = true }
tenta-cdp = { workspace = true }
tenta-mcp = { workspace = true }
# Tier 0/1 only: the CLI's `fetch --dump text` path must not reach a crate
# above `tenta-net` (`docs/spec/13-performance.md` §1). `tests/tier.rs`
# asserts the dependency graph stays free of v8, stylo and wgpu.
tenta-net = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
clap = { version = "4", features = ["derive", "wrap_help", "env"] }
# The CLI owns the process runtime; the engine's io and page threads are its
# own. A current-thread runtime keeps the cold start free of worker threads.
tokio = { version = "1", features = ["rt", "macros", "time", "signal"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "std"] }

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
tenta-testutil = { workspace = true }
# Decodes the screenshots the `render` tests write.
png = { workspace = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }

[[bin]]
name = "tentabrowser"
path = "src/main.rs"
