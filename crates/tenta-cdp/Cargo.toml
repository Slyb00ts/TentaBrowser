[package]
name = "tenta-cdp"
description = "Chrome DevTools Protocol server: domains, sessions, targets and screencast."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Runs the Runtime tests against a real page engine. Without it the crate
# builds no JavaScript, like the other hosts.
v8 = ["tenta-browser/v8"]

[[test]]
name = "runtime"
required-features = ["v8"]

[dependencies]
tenta-core = { workspace = true }
tenta-browser = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "rt-multi-thread"] }
tokio-tungstenite = { workspace = true }
httparse = { workspace = true }
getrandom = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
