[package]
name = "tenta-js-v8"
description = "V8 backend (rusty_v8): isolates, snapshots, fast API, native Wasm, worker isolates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
tenta-core = { workspace = true }
tenta-dom = { workspace = true }
tenta-js = { workspace = true, features = ["v8"] }
# `document.cookie` hands the browsing context's cookie jar from the page
# configuration to the binding layer. The backend only names the type in a field
# and a parameter — it holds no cookie logic — and `tenta-net` sits below
# `tenta-js-v8` in `xtask/src/deps.rs`'s foundation order, so the edge is
# allowed.
tenta-net = { workspace = true }
# A module is named by its URL: the module map is keyed by it and the page is
# told which URLs a compiled module imports (`src/modules.rs`).
url = { workspace = true }
v8 = { workspace = true }

[dev-dependencies]
tenta-html = { workspace = true }
