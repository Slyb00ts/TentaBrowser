[package]
name = "tenta-js-v8"
description = "V8 backend (rusty_v8): isolates, snapshots, fast API, native Wasm, worker isolates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
tenta-core = { workspace = true }
tenta-dom = { workspace = true }
tenta-js = { workspace = true, features = ["v8"] }
v8 = { workspace = true }

[dev-dependencies]
tenta-html = { workspace = true }
# URL reflection tests need a document with a base URL, and
# `Document::with_url` takes a `url::Url`.
url = { workspace = true }
