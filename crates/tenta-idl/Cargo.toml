[package]
name = "tenta-idl"
description = "WebIDL parser and binding code generator used at build time by feature crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# `format` runs the generated source through prettyplease. It changes only
# whitespace, so golden files record the unformatted output.
format = ["dep:prettyplease", "dep:syn"]
# The generated prelude gates its engine glue on these names. Enabling `v8`
# pulls the `v8` crate so the `compile_v8` test can type-check the generated V8
# glue against the pinned rusty_v8 version (drift guard for the generator);
# without it the plain `compile` include test runs instead. A consumer crate
# declares features with the same names next to its own engine dependencies.
v8 = ["dep:v8"]
quickjs = ["dep:rquickjs"]

[dependencies]
weedle = { package = "weedle4", version = "0.4" }
thiserror.workspace = true
prettyplease = { version = "0.2", optional = true }
syn = { version = "2", features = ["full", "parsing"], optional = true }
v8 = { workspace = true, optional = true }
rquickjs = { workspace = true, optional = true }

[dev-dependencies]
syn = { version = "2", features = ["full", "parsing"] }

[[bin]]
name = "tenta-idl"
path = "src/bin/tenta-idl.rs"
