<!doctype html>
<html><head><title>Shadow components</title></head>
<body>
<h1>Components</h1>
<x-counter label="Clicks"><span slot="hint">Press the button</span></x-counter>
<script>
class Counter extends HTMLElement {
  constructor() {
    super();
    this.count = 0;
    const root = this.attachShadow({mode: 'open'});
    root.innerHTML =
      '<p><slot name="hint">No hint</slot></p>' +
      '<button id="add" type="button">Add one</button>' +
      '<output id="total"></output>';
    root.getElementById('add').addEventListener('click', () => {
      this.count += 1;
      this.render();
    });
  }
  connectedCallback() { this.render(); }
  render() {
    this.shadowRoot.getElementById('total').textContent =
      this.getAttribute('label') + ': ' + this.count;
  }
}
customElements.define('x-counter', Counter);
</script>
</body></html>
