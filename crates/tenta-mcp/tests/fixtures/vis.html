<!doctype html>
<html><head><title>Vis</title>
<style>.gone{display:none}</style></head>
<body>
<p style="visibility: hidden">Invisible inline</p>
<p style="opacity: 0">Ghost inline</p>
<p class="gone">Gone by class</p>
<div style="visibility:hidden"><span style="visibility:visible">Shown child</span><b>Hidden sibling</b></div>
<p>Visible text</p>
</body></html>
