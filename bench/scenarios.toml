# Render pipeline scenarios, driven by `bench/render.py` against the
# `render_bench` example of `tenta-render` (JSON line per iteration). The
# staged scenarios time style flush, box tree and layout separately; the
# session scenarios (`S-screenshot`, `S-fullpage*`, `S-fixtures`) time the
# product path, whose layout stage covers all three. `cold` iterations use a new
# session or text the shaping caches have never seen, `warm` ones repeat.
# `S-screenshot` and `S-fullpage` above stay the cross-implementation CLI
# comparisons; the `-inproc` entries below are the engine measurements of the
# same pages and are not comparable with them.

[[scenario]]
name = "S-screenshot-inproc"
phase = "P3"
fixture = "static-article"
path = "/static-article/index.html"
mode = "inprocess"
